[build]
  # The Studio is built after Gatsby, since gatsby build empties public/.
  command = "npm run build && npm run build:studio-into-site"
  publish = "public"
  functions = "functions"

[functions]
  node_bundler = "esbuild"

[build.environment]
  # 22+: Sanity Studio (studio/) requires Node >= 22.12.
  NODE_VERSION = "22"
  NODE_OPTIONS = "--max_old_space_size=4096"
  # The Contentful space ID appears in every public image URL (images.ctfassets.net/<id>/...),
  # so it isn't a secret; the access tokens stay covered by secrets scanning.
  SECRETS_SCAN_OMIT_KEYS = "CONTENTFUL_SPACE_ID"

[[plugins]]
  package = "@netlify/plugin-gatsby"

[[redirects]]
  from = "/weddings-punta-cana/*"
  to = "/puntacana-wedding-planner/"
  status = 301
  force = true

[[redirects]]
  from = "/es/weddings-punta-cana/*"
  to = "/es/puntacana-wedding-planner/"
  status = 301
  force = true

[[redirects]]
  from = "/packages/ocean-of-love"
  to = "/proposal/"
  status = 301
  force = true

[[redirects]]
  from = "/packages/ocean-of-love/*"
  to = "/proposal/"
  status = 301
  force = true

[[redirects]]
  from = "/es/packages/ocean-of-love"
  to = "/es/proposal/"
  status = 301
  force = true

[[redirects]]
  from = "/es/packages/ocean-of-love/*"
  to = "/es/proposal/"
  status = 301
  force = true

# The sitemap is emitted at /sitemap-index.xml (gatsby-plugin-sitemap default).
# Crawlers, SEO tools and AI agents conventionally probe /sitemap.xml first, so
# point that path at the real one. No `force`: if the sitemap is ever emitted at
# /sitemap.xml directly, the real file should win over this redirect.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

# Sanity Studio, built into public/studio by build:studio-into-site.
# No `force` on the fallback, so real files under /studio/static/ are served as-is
# and only Studio routes such as /studio/structure/... fall through to its index.html.
# /studio itself is served from public/studio/index.html; no slash redirect, because
# Netlify matches /studio and /studio/ as the same path and would loop.
[[redirects]]
  from = "/studio/*"
  to = "/studio/index.html"
  status = 200

[[headers]]
  for = "/studio/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
