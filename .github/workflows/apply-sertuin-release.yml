name: Apply Sertuin release

on:
  push:
    branches:
      - main
    paths:
      - sertuin-release.patch

permissions:
  contents: write

jobs:
  apply-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified release patch
        shell: bash
        run: |
          set -euo pipefail
          test -f sertuin-release.patch
          git apply --check --whitespace=nowarn sertuin-release.patch
          git apply --whitespace=nowarn sertuin-release.patch
          rm sertuin-release.patch
          rm .github/workflows/apply-sertuin-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish wedding planner, gender reveal and SEO updates"
          git push origin HEAD:main
